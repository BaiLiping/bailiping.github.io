<svg xmlns="http://www.w3.org/2000/svg" width="562" height="448" viewBox="0 0 562 448" role="img" aria-labelledby="t d"><title id="t">Two sources contribute to one array observation</title><desc id="d">Object states determine steering vectors. Random complex amplitudes weight them. All source responses add coherently at each receiver, giving one joint complex observation.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#60747A"/></marker></defs><rect x=".5" y=".5" width="561" height="447" rx="10" fill="#FFFDFA" stroke="#D6DEDC"/><g font-family="Arial,Helvetica,sans-serif" fill="#182D33"><text x="24" y="38" font-size="14" font-weight="bold" fill="#16736E">ONE COMPLEX OBSERVATION BLOCK</text><circle cx="140" cy="108" r="18" fill="#16736E"/><circle cx="420" cy="108" r="18" fill="#B44F37"/><text x="140" y="78" text-anchor="middle" font-size="20">Object 1 · x₁</text><text x="420" y="78" text-anchor="middle" font-size="20">Object 2 · x₂</text><text x="140" y="151" text-anchor="middle" font-size="20" fill="#16736E">ρ₁ a(x₁)</text><text x="420" y="151" text-anchor="middle" font-size="20" fill="#B44F37">ρ₂ a(x₂)</text><g stroke="#16736E" stroke-width="2" opacity=".48"><path d="M140,129L116,239M140,129L226,239M140,129L336,239M140,129L446,239"/></g><g stroke="#B44F37" stroke-width="2" opacity=".48"><path d="M420,129L116,239M420,129L226,239M420,129L336,239M420,129L446,239"/></g><rect x="69" y="239" width="424" height="54" rx="9" fill="#E4F0ED" stroke="#D6DEDC"/><g fill="#182D33"><rect x="106" y="251" width="20" height="20" rx="3"/><rect x="216" y="251" width="20" height="20" rx="3"/><rect x="326" y="251" width="20" height="20" rx="3"/><rect x="436" y="251" width="20" height="20" rx="3"/></g><text x="281" y="319" text-anchor="middle" font-size="18">Relative phase depends on geometry</text><path d="M281,331V352" stroke="#60747A" stroke-width="2" marker-end="url(#arr)"/><text x="281" y="383" text-anchor="middle" font-size="25" font-weight="bold">z = ρ₁a₁ + ρ₂a₂ + w</text><text x="281" y="419" text-anchor="middle" font-size="16" fill="#60747A">Each receiver observes the coherent sum.</text></g></svg>
