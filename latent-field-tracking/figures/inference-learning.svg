<svg xmlns="http://www.w3.org/2000/svg" width="1136" height="448" viewBox="0 0 1136 448" role="img" aria-labelledby="t d"><title id="t">The tracking and field-learning loop</title><desc id="d">The current latent field supplies power priors to Bayesian inference. Measurements and predicted kinematics enter inference. Posterior existence and power beliefs, paired with frozen contexts, train the shared field. The updated field supplies priors for later measurements.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#16736E"/></marker></defs><g font-family="Arial,Helvetica,sans-serif"><g stroke="#D6DEDC" fill="#FFFDFA"><rect x="0.5" y=".5" width="1135" height="447" rx="10"/><rect x="37" y="45" width="242" height="77" rx="8"/><rect x="37" y="162" width="242" height="77" rx="8"/><rect x="380" y="80" width="316" height="151" rx="8" fill="#E4F0ED"/><rect x="789" y="80" width="310" height="151" rx="8"/><rect x="789" y="309" width="310" height="97" rx="8" fill="#E4F0ED"/><rect x="380" y="309" width="316" height="97" rx="8"/></g><g fill="#182D33" font-size="22" text-anchor="middle"><text x="158" y="77">Raw complex data</text><text x="158" y="104" font-size="18" fill="#60747A">zₖ</text><text x="158" y="195">Motion &amp; survival</text><text x="158" y="222" font-size="18" fill="#60747A">Predicted state beliefs</text><text x="538" y="118" font-weight="bold">Bayesian inference</text><text x="538" y="152" font-size="20">Particle BP</text><text x="538" y="190" font-size="18" fill="#60747A">Joint complex likelihood</text><text x="944" y="118" font-weight="bold">Posterior evidence</text><text x="944" y="153" font-size="20">Existence &amp; power beliefs</text><text x="944" y="190" font-size="18" fill="#60747A">Fixed contexts + cached history</text><text x="944" y="345" font-weight="bold">Density learning</text><text x="944" y="379" font-size="19">Increase J₁:ₖ(θ)</text><text x="538" y="345" font-weight="bold">Shared latent field</text><text x="538" y="379" font-size="19">fθ(γ ; c)</text></g><g fill="none" stroke="#16736E" stroke-width="2.5" marker-end="url(#a)"><path d="M279,84H329V122H372"/><path d="M279,200H329V184H372"/><path d="M696,153H781"/><path d="M944,231V301"/><path d="M789,357H704"/><path d="M538,309V239"/></g><g font-size="16" fill="#16736E"><text x="958" y="273">Keep beliefs fixed</text><text x="392" y="271">Power prior</text></g><text x="38" y="344" font-size="18" fill="#60747A">Updates to θ carry forward.</text><text x="38" y="375" font-size="18" fill="#60747A">No gradient through tracking history.</text></g></svg>
