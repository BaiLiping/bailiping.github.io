cy="235" r="5" fill="#182D33"/><text x="439" y="188" fill="#16736E" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" text-anchor="start">s₀</text><text x="321" y="315" fill="#16736E" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" text-anchor="start">s₁</text><text x="212" y="80" fill="#B44F37" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" text-anchor="start">normal n</text><text x="270" y="262" fill="#182D33" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start">center μ</text><text x="24" y="379" fill="#182D33" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start">Two tangent scales define the footprint.</text><text x="24" y="411" fill="#60747A" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">Tracking adds a small normal thickness.</text></svg>
