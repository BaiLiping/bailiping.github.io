amily="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" text-anchor="start">φ = atan2(y, x)</text><text x="24" y="415" fill="#182D33" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" text-anchor="start">θ = atan2(z, √(x² + y²))</text><text x="395" y="410" fill="#60747A" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">Schematic angular sampling</text></svg>
