<svg xmlns="http://www.w3.org/2000/svg" width="676" height="448" viewBox="0 0 676 448" role="img" aria-labelledby="title desc"><title id="title">Spherical LiDAR projection</title><desc id="desc">An observed ray is described by azimuth, elevation and range. Angular coordinates select a range-image cell.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#16736E"/></marker><marker id="rustarrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#B44F37"/></marker></defs><rect x="0" y="0" width="676" height="448" rx="10" fill="#FFFDFA" stroke="#D6DEDC"/><text x="24" y="38" fill="#16736E" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="start">3D OBSERVATION</text><text x="395" y="38" fill="#16736E" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="start">ANGULAR GRID</text><circle cx="173" cy="203" r="111" fill="#E4F0ED" stroke="#D6DEDC" stroke-width="2"/><ellipse cx="173" cy="203" rx="111" ry="34" fill="none" stroke="#B8CBC4" stroke-dasharray="5 5"/><path d="M173 203L275 248" fill="none" stroke="#60747A" stroke-width="1.5"/><path d="M173 203L73 244" fill="none" stroke="#60747A" stroke-width="1.5"/><path d="M173 203V77" fill="none" stroke="#60747A" stroke-width="1.5"/><text x="284" y="259" fill="#60747A" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">x</text><text x="55" y="259" fill="#60747A" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">y</text><text x="166" y="68" fill="#60747A" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">z</text><path d="M173 203L248 126" fill="none" stroke="#B44F37" stroke-width="3" marker-end="url(#rustarrow)"/><circle cx="248" cy="126" r="6" fill="#B44F37"/><text x="216" y="118" fill="#B44F37" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">return p</text><text x="204" y="174" fill="#B44F37" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="start">range r</text><circle cx="173" cy="203" r="7" fill="#182D33"/><text x="113" y="301" fill="#182D33" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">LiDAR origin</text><path d="M282 157L373 133" fill="none" stroke="#16736E" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="396" y="111" width="24" height="25" fill="#FFFFFF" opacity="1.00" stroke="#D6DEDC"/><rect x="422" y="111" width="24" height="25" fill="#16736E" opacity="0.17" stroke="#D6DEDC"/><rect x="448" y="111" width="24" height="25" fill="#16736E" opacity="0.26" stroke="#D6DEDC"/><rect x="474" y="111" width="24" height="25" fill="#16736E" opacity="0.34" stroke="#D6DEDC"/><rect x="500" y="111" width="24" height="25" fill="#16736E" opacity="0.42" stroke="#D6DEDC"/><rect x="526" y="111" width="24" height="25" fill="#16736E" opacity="0.51" stroke="#D6DEDC"/><rect x="552" y="111" width="24" height="25" fill="#16736E" opacity="0.59" stroke="#D6DEDC"/><rect x="578" y="111" width="24" height="25" fill="#16736E" opacity="0.09" stroke="#D6DEDC"/><rect x="604" y="111" width="24" height="25" fill="#16736E" opacity="0.17" stroke="#D6DEDC"/><rect x="396" y="138" width="24" height="25" fill="#16736E" opacity="0.17" stroke="#D6DEDC"/><rect x="422" y="138" width="24" height="25" fill="#16736E" opacity="0.26" stroke="#D6DEDC"/><rect x="448" y="138" width="24" height="25" fill="#FFFFFF" opacity="1.00" stroke="#D6DEDC"/><rect x="474" y="138" width="24" height="25" fill="#16736E" opacity="0.42" stroke="#D6DEDC"/><rect x="500" y="138" width="24" height="25" fill="#16736E" opacity="0.51" stroke="#D6DEDC"/><rect x="526" y="138" width="24" height="25" fill="#16736E" opacity="0.59" stroke="#D6DEDC"/><rect x="552" y="138" width="24" height="25" fill="#16736E" op