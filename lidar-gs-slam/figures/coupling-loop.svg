<svg xmlns="http://www.w3.org/2000/svg" width="1136" height="448" viewBox="0 0 1136 448" role="img" aria-labelledby="title desc"><title id="title">Bidirectional geometry reuse</title><desc id="desc">A new LiDAR scan enters G-ICP tracking. Estimated poses and cached source geometry initialize mapping. The optimized Gaussian map feeds target geometry back into the tracker.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#16736E"/></marker><marker id="rustarrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#B44F37"/></marker></defs><rect x="0" y="0" width="1136" height="448" rx="10" fill="#FFFDFA" stroke="#D6DEDC"/><rect x="25" y="112" width="244" height="145" rx="10" fill="#E4F0ED" stroke="#D6DEDC"/><text x="47" y="149" fill="#182D33" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" text-anchor="start">LiDAR scan</text><text x="47" y="187" fill="#182D33" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start">Downsample points</text><text x="47" y="220" fill="#60747A" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">Estimate local covariance</text><rect x="369" y="58" width="310" height="168" rx="10" fill="#E4F0ED" stroke="#D6DEDC"/><text x="393" y="98" fill="#182D33" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" text-anchor="start">G-ICP tracking</text><text x="393" y="136" fill="#182D33" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" text-anchor="start">Match scan to map</text><text x="393" y="171" fill="#182D33" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" text-anchor="start">Estimate pose T</text><text x="393" y="205" fill="#60747A" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">Cache source geometry</text><rect x="786" y="58" width="324" height="168" rx="10" fill="#FFFDFA" stroke="#D6DEDC"/><text x="810" y="98" fill="#182D33" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" text-anchor="start">Gaussian mapping</text><text x="810" y="136" fill="#182D33" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">Initialize keyframe surfaces</text><text x="810" y="171" fill="#182D33" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">Optimize range-image loss</text><text x="810" y="205" fill="#60747A" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">Manage map complexity</text><rect x="786" y="316" width="324" height="105" rx="10" fill="#E4F0ED" stroke="#D6DEDC"/><text x="810" y="353" fill="#182D33" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">Refined Gaussian map</text><text x="810" y="390" fill="#182D33" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">Means, orientations and scales</text><path d="M269 184H355" fill="none" stroke="#16736E" stroke-width="3" marker-end="url(#arrow)"/><path d="M679 142H772" fill="none" stroke="#16736E" stroke-width="3" marker-end="url(#arrow)"/><text x="720" y="44" fill="#16736E" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="middle">Pose + priors</text><path d="M949 227V301" fill="none" stroke="#16736E" stroke-width="3" marker-end="url(#arrow)"/><text x="971" y="272" fill="#16736E" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">Update</text><path d="M786 366H525V241" fill="none" stroke="#B44F37" stroke-width="3" marker-end="url(#rustarrow)"/><text x="97" y="323" fill="#B44F37" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">Mapping back to tracking</text><text x="97" y="356" fill="#60747A" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="start">Reuse optimized target geometry</text><text x="97" y="403" fill="#60747A" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">The next registration receives the updated surface model.</text></svg>
