<svg xmlns="http://www.w3.org/2000/svg" width="670" height="448" viewBox="0 0 670 448" role="img" aria-labelledby="title desc"><title id="title">Keyframe-wise map correction</title><desc id="desc">Pose-graph optimization changes keyframe poses. Each keyframe moves its associated Gaussian primitives by its own rigid transform delta.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#16736E"/></marker><marker id="rustarrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#B44F37"/></marker></defs><rect x="0" y="0" width="670" height="448" rx="10" fill="#FFFDFA" stroke="#D6DEDC"/><text x="25" y="38" fill="#16736E" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="start">POSE GRAPH</text><path d="M70 128L142 96L233 111L268 193L209 249L119 231L70 190" fill="none" stroke="#B44F37" stroke-width="3"/><circle cx="70" cy="128" r="7" fill="#FFFDFA" stroke="#B44F37" stroke-width="3"/><circle cx="142" cy="96" r="7" fill="#FFFDFA" stroke="#B44F37" stroke-width="3"/><circle cx="233" cy="111" r="7" fill="#FFFDFA" stroke="#B44F37" stroke-width="3"/><circle cx="268" cy="193" r="7" fill="#FFFDFA" stroke="#B44F37" stroke-width="3"/><circle cx="209" cy="249" r="7" fill="#FFFDFA" stroke="#B44F37" stroke-width="3"/><circle cx="119" cy="231" r="7" fill="#FFFDFA" stroke="#B44F37" stroke-width="3"/><circle cx="70" cy="190" r="7" fill="#FFFDFA" stroke="#B44F37" stroke-width="3"/><path d="M401 128L473 102L557 116L589 193L535 250L449 232L401 128" fill="none" stroke="#16736E" stroke-width="3"/><circle cx="401" cy="128" r="7" fill="#FFFDFA" stroke="#16736E" stroke-width="3"/><circle cx="473" cy="102" r="7" fill="#FFFDFA" stroke="#16736E" stroke-width="3"/><circle cx="557" cy="116" r="7" fill="#FFFDFA" stroke="#16736E" stroke-width="3"/><circle cx="589" cy="193" r="7" fill="#FFFDFA" stroke="#16736E" stroke-width="3"/><circle cx="535" cy="250" r="7" fill="#FFFDFA" stroke="#16736E" stroke-width="3"/><circle cx="449" cy="232" r="7" fill="#FFFDFA" stroke="#16736E" stroke-width="3"/><circle cx="401" cy="128" r="7" fill="#FFFDFA" stroke="#16736E" stroke-width="3"/><path d="M70 190V128" fill="none" stroke="#B44F37" stroke-width="2" stroke-dasharray="5 4"/><text x="52" y="285" fill="#B44F37" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="start">Before correction</text><text x="411" y="285" fill="#16736E" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="start">After correction</text><path d="M291 175H363" fill="none" stroke="#16736E" stroke-width="3" marker-end="url(#arrow)"/><ellipse cx="499" cy="91" rx="25" ry="9" transform="rotate(10 499 91)" fill="#E4F0ED" stroke="#16736E"/><ellipse cx="567" cy="106" rx="25" ry="9" transform="rotate(25 567 106)" fill="#E4F0ED" stroke="#16736E"/><ellipse cx="544" cy="236" rx="25" ry="9" transform="rotate(-20 544 236)" fill="#E4F0ED" stroke="#16736E"/><text x="25" y="341" fill="#60747A" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">For each source keyframe k:</text><text x="25" y="380" fill="#182D33" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" text-anchor="start">ΔTₖ = Tₖ new (Tₖ old)⁻¹</text><text x="25" y="417" fill="#182D33" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">Its Gaussian centers and orientations follow ΔTₖ.</text></svg>
