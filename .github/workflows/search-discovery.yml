name: Search discovery

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - sitemap.xml
      - robots.txt
      - scripts/build-search-index.py
      - .github/workflows/search-discovery.yml
      - 'flight-tracker/**'
      - 'tests/flight-*.cjs'
      - 'tests/flight-*.mjs'
  pull_request:
    paths:
      - '**/*.html'
      - sitemap.xml
      - robots.txt
      - scripts/build-search-index.py
      - .github/workflows/search-discovery.yml
      - 'flight-tracker/**'
      - 'tests/flight-*.cjs'
      - 'tests/flight-*.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check sitemap and public page directory
        run: python3 scripts/build-search-index.py --check
      - name: Check saved flight observations and lookup logic
        run: node tests/flight-tracker.test.cjs
      - name: Check source validation, update scripts, and live API limits
        run: node --test tests/flight-live-api.test.mjs tests/flight-history-search.test.cjs tests/flight-update.test.cjs
