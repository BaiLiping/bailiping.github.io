name: Search discovery

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - sitemap.xml
      - robots.txt
      - scripts/build-search-index.py
      - scripts/crawl-potential-jobs.py
      - scripts/render-potential-jobs.py
      - career/job-sources.json
      - career/potential-jobs/jobs.json
      - career/potential-jobs/template.html
      - tests/test_job_*.py
      - .github/workflows/search-discovery.yml
  pull_request:
    paths:
      - '**/*.html'
      - sitemap.xml
      - robots.txt
      - scripts/build-search-index.py
      - scripts/crawl-potential-jobs.py
      - scripts/render-potential-jobs.py
      - career/job-sources.json
      - career/potential-jobs/jobs.json
      - career/potential-jobs/template.html
      - tests/test_job_*.py
      - .github/workflows/search-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check sitemap and public page directory
        run: python3 scripts/build-search-index.py --check
      - name: Validate job watch snapshot and civilian scope
        run: |
          python3 -m unittest discover -s tests -p 'test_job_*.py'
          python3 scripts/render-potential-jobs.py --check
