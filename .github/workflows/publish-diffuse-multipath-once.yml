name: Publish verified diffuse-multipath presentation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-diffuse-multipath-once.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-diffuse-multipath
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Restore exact browser-tested HTML and add its homepage link
        shell: python
        run: |
          import base64, hashlib, lzma
          from pathlib import Path
          encoded = (
            ''
            ''
            ''
          )
          html = lzma.decompress(base64.b64decode(encoded, validate=True))
          expected = 'a55359122bf834ccf8fa7f03943c2a3f8e37a26a28bd3a194f7b7ef9b0d60052'
          assert hashlib.sha256(html).hexdigest() == expected, 'Payload checksum mismatch'
          target = Path('diffuse-multipath/index.html')
          if target.exists():
              assert target.read_bytes() == html, 'Refusing to overwrite a different existing presentation'
          target.parent.mkdir(exist_ok=True)
          target.write_bytes(html)
          home = Path('index.html')
          text = home.read_text(encoding='utf-8')
          route = 'href="/diffuse-multipath/"'
          marker = '<h2 class="group-title" id="group-random-thoughts">Random thoughts</h2>\n        <div class="page-list">'
          card = '\n          <a class="page-link" href="/diffuse-multipath/">\n            <strong>Diffuse Multipath · Rough-Surface Scattering</strong>\n          </a>'
          if route not in text:
              assert text.count(marker) == 1, 'Homepage insertion point changed'
              home.write_text(text.replace(marker, marker + card, 1), encoding='utf-8')
          print('Restored exact tested HTML:', len(html), 'bytes; SHA-256:', expected)
      - name: Regenerate public search discovery and commit only this publication
        run: |
          git add diffuse-multipath/index.html index.html
          python3 scripts/build-search-index.py
          python3 scripts/build-search-index.py --check
          git add sitemap.xml site-map/index.html
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Kulmer diffuse-multipath interactive presentation'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
