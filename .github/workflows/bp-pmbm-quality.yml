name: BP and PMBM lesson quality

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bp-pmbm-quality.yml'
      - 'bp-vs-pmbm/**'
      - 'bp-vs-pmbm-slides/**'
      - 'scripts/refine-bp-pmbm.py'
      - 'tests/bp-pmbm*'

permissions:
  contents: read

concurrency:
  group: bp-pmbm-quality
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check mathematics and generated content
        run: |
          node --check bp-vs-pmbm/association-model.js
          node --check bp-vs-pmbm-slides/live/app.js
          node --check bp-vs-pmbm-slides/build-deck.mjs
          python3 scripts/refine-bp-pmbm.py
          node bp-vs-pmbm-slides/build-deck.mjs
          node --test tests/bp-pmbm.test.cjs
          git diff --check
          git diff --exit-code -- bp-vs-pmbm/index.html bp-vs-pmbm-slides/build-deck.mjs bp-vs-pmbm-slides/index.html
      - name: Install browser test tools
        run: |
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
      - name: Check live controls and actual sandboxed slide embeds
        run: python tests/bp-pmbm-browser.py
      - name: Retain browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bp-pmbm-browser-report
          path: bp-pmbm-browser-report/
          if-no-files-found: warn
          retention-days: 7
