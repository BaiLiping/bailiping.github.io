name: Build detailed radio SLAM companion page

on:
  push:
    branches:
      - main
    paths:
      - scripts/enhance-radio-slam-companion.mjs
      - scripts/add-radio-slam-problem-formulation.mjs
      - scripts/upgrade-radio-slam-formulation-3d.mjs
      - mpc-detection-to-bounce-count/companion.css
      - mpc-detection-to-bounce-count/index.html
      - .github/workflows/build-radio-slam-companion.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Normalize problem-formulation validator
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'scripts/add-radio-slam-problem-formulation.mjs'
          const lines = fs.readFileSync(path, 'utf8').split('\n')
          const index = lines.findIndex(line => line.trim().startsWith("'two bounce,") && line.includes('j_1'))
          if (index >= 0) lines[index] = "  'two bounce,',"
          fs.writeFileSync(path, lines.join('\n'))
          NODE

      - name: Validate companion-page patch syntax
        run: |
          node --check scripts/enhance-radio-slam-companion.mjs
          node --check scripts/add-radio-slam-problem-formulation.mjs
          node --check scripts/upgrade-radio-slam-formulation-3d.mjs

      - name: Apply detailed companion-page revision
        run: node scripts/enhance-radio-slam-companion.mjs

      - name: Add unified radio SLAM problem formulation
        run: node scripts/add-radio-slam-problem-formulation.mjs

      - name: Upgrade the formal model and factors to 3D
        run: node scripts/upgrade-radio-slam-formulation-3d.mjs

      - name: Normalize generated companion navigation
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'mpc-detection-to-bounce-count/index.html'
          let html = fs.readFileSync(path, 'utf8')
          const graphLink = '    <a href="#bistatic-graphslam">GraphSLAM bridge</a>\n'
          while (html.split(graphLink).length - 1 > 1) {
            const first = html.indexOf(graphLink)
            html = html.slice(0, first) + html.slice(first + graphLink.length)
          }
          fs.writeFileSync(path, html)
          NODE

      - name: Validate generated page
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'mpc-detection-to-bounce-count/index.html'
          const html = fs.readFileSync(path, 'utf8')
          const required = [
            'href="companion.css"',
            'id="radio-companion-mathjax-config"',
            'id="notation"',
            'id="indices-and-states"',
            'id="angle-frames"',
            'id="measurement-noise"',
            'id="model-boundary"',
            'id="problem-formulation"',
            'data-formulation-dimension="3d"',
            'id="formulation-state"',
            'id="formulation-hypothesis"',
            'id="formulation-measurement"',
            'id="formulation-map"',
            'id="bistatic-graphslam"',
            'id="factor-language"',
            'id="bistatic-factor"',
            'data-radio-factor-dimension="3d"',
            'id="va-factor"',
            'data-va-factor-dimension="3d"',
            'id="radio-graph-objective"',
            'A complete 3D radio-SLAM problem formulation',
            'Recommended map state',
            '{}^{W}\\mathbf T_{U_t}',
            '\\in SE(3)\\times\\mathbb R',
            '\\boldsymbol\\pi_j=(\\mathbf n_j,d_j)\\in\\mathbb S^2\\times\\mathbb R',
            '\\mathbf H_j\\in O(3),\\quad\\det\\mathbf H_j=-1',
            '\\operatorname{Log}_{\\mathbb S^2,\\widehat{\\mathbf u}}',
            'O(3)\\setminus SO(3)',
            '\\mathfrak{se}(3)\\simeq\\mathbb R^6',
            '\\mathbf h_0',
            '\\mathbf h_1',
            '\\mathbf h_2',
            'two bounce,',
            'clutter / false alarm',
            '<h2><span class="no">06</span>Bistatic radio SLAM as GraphSLAM</h2>',
            'GraphSLAM does not assume that every physical device is onboard',
            'L_{ts\\ell}=c\\big(\\tau_{ts\\ell}-\\delta_{ts}\\big)',
            '\\(a=0\\) uses a clutter likelihood',
            'Only after calibration should gain enter',
            'Detailed interactive companion'
          ]
          for (const value of required) {
            if (!html.includes(value)) throw new Error(`Missing required generated content: ${value}`)
          }
          const uniqueIds = [
            'notation',
            'indices-and-states',
            'angle-frames',
            'measurement-noise',
            'model-boundary',
            'problem-formulation',
            'formulation-state',
            'formulation-hypothesis',
            'formulation-measurement',
            'formulation-map',
            'bistatic-graphslam',
            'factor-language',
            'bistatic-factor',
            'va-factor',
            'radio-graph-objective'
          ]
          for (const id of uniqueIds) {
            const count = html.split(`id="${id}"`).length - 1
            if (count !== 1) throw new Error(`Expected exactly one id=${id}; found ${count}`)
          }
          for (const [link, expected] of [
            ['href="#problem-formulation"', 1],
            ['href="#bistatic-graphslam"', 1]
          ]) {
            const count = html.split(link).length - 1
            if (count !== expected) throw new Error(`Expected ${expected} occurrence of ${link}; found ${count}`)
          }
          const forbidden = [
            'a <strong>delay</strong> (a path length)',
            'These 2D checks assume synchronized delay and globally oriented AoA/AoD.',
            'Each 2D construction assumes synchronized delay and globally oriented AoA/AoD.',
            'AoD ψ is available in the global frame.',
            'Paths with the same travel distance span ~20&nbsp;dB',
            'half of all matched pairs differ by more than 3&nbsp;dB',
            '<h2><span class="no">05</span>Bistatic radio SLAM as GraphSLAM</h2>'
          ]
          for (const value of forbidden) {
            if (html.includes(value)) throw new Error(`Legacy wording remains: ${value}`)
          }
          const start = html.indexOf('data-formulation-dimension="3d"')
          const end = html.indexOf('<!-- ============ 06 bistatic radio to GraphSLAM ============ -->', start)
          if (start < 0 || end < 0) throw new Error('Could not isolate the 3D problem-formulation section')
          const formulation = html.slice(start, end)
          for (const value of [
            'planar \\(SE(2)\\) model',
            '\\mathbb R^2\\times\\mathbb S^1',
            'Physical wall state in 2D',
            '\\mathbf m^{\\mathrm{VA}}_{sj}=\\mathbf v_{sj}\\in\\mathbb R^2'
          ]) {
            if (formulation.includes(value)) throw new Error(`Legacy 2D formulation remains: ${value}`)
          }
          if (html.includes('\u0000')) throw new Error('Generated page contains a null byte')
          const css = fs.readFileSync('mpc-detection-to-bounce-count/companion.css', 'utf8')
          for (const selector of ['.companion-math-grid', '.factor-bridge', '.reference-list']) {
            if (!css.includes(selector)) throw new Error(`Missing companion style: ${selector}`)
          }
          console.log('Validated 3D SE(3) states, spherical directions, LoS/one-/two-bounce factors, hybrid MAP, and GraphSLAM bridge.')
          NODE

      - name: Check whitespace and generated diff
        run: git diff --check

      - name: Commit generated companion page
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/build-radio-slam-companion.yml \
            scripts/enhance-radio-slam-companion.mjs \
            scripts/add-radio-slam-problem-formulation.mjs \
            scripts/upgrade-radio-slam-formulation-3d.mjs \
            mpc-detection-to-bounce-count/companion.css \
            mpc-detection-to-bounce-count/index.html
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Generate 3D radio SLAM problem formulation"
            git push origin HEAD:"$TARGET_BRANCH"
          fi