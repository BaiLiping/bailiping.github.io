name: Multidensity fusion numerical and browser checks
on:
  push:
    branches: [main]
    paths:
      - multidensity-fusion/**
      - assets/bento-inline-live.*
      - assets/mathjax-dynamic.js
      - kalman-filter-derivations/index.html
      - .github/workflows/multidensity-fusion-quality.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: multidensity-fusion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            multidensity-fusion
            kalman-filter-derivations
            assets
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check numerical kernels and deck structure
        run: |
          node --test multidensity-fusion/test.mjs
          node --check multidensity-fusion/boot.mjs
          node --check multidensity-fusion/live/lab.mjs
          git diff --check
      - name: Install the browser test dependency
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Exercise the shared Bento engine and all six labs
        run: python multidensity-fusion/test-browser.py
      - name: Save screenshots and the verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multidensity-fusion-checks
          path: test-results/multidensity-fusion/
          retention-days: 7
