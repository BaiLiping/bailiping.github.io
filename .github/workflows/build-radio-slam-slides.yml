name: Build enhanced radio SLAM slides

on:
  push:
    branches:
      - main
      - enhance-radio-slam-graphslam
    paths:
      - mpc-detection-to-bounce-count-slides/radio-slam-extra.mjs
      - mpc-detection-to-bounce-count-slides/radio-graphslam-live/**
      - scripts/patch-radio-slam-slides.mjs
      - scripts/add-bundle-adjustment-slide.mjs
      - scripts/add-isam2-slides.mjs
      - scripts/fix-isam2-label.mjs
      - scripts/fix-radio-graphslam-slide.mjs
      - scripts/fix-radio-graphslam-clutter-notation.mjs
      - .github/workflows/build-radio-slam-slides.yml
  pull_request:
    branches:
      - main
    paths:
      - mpc-detection-to-bounce-count-slides/radio-slam-extra.mjs
      - mpc-detection-to-bounce-count-slides/radio-graphslam-live/**
      - scripts/patch-radio-slam-slides.mjs
      - scripts/add-bundle-adjustment-slide.mjs
      - scripts/add-isam2-slides.mjs
      - scripts/fix-isam2-label.mjs
      - scripts/fix-radio-graphslam-slide.mjs
      - scripts/fix-radio-graphslam-clutter-notation.mjs
      - .github/workflows/build-radio-slam-slides.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Materialize staged source payloads
        run: |
          if [ -f scripts/radio-slam-payload/app.js.gz.b64 ]; then
            base64 -d scripts/radio-slam-payload/app.js.gz.b64 | gzip -dc > mpc-detection-to-bounce-count-slides/radio-graphslam-live/app.js
            base64 -d scripts/radio-slam-payload/radio-slam-extra.mjs.gz.b64 | gzip -dc > mpc-detection-to-bounce-count-slides/radio-slam-extra.mjs
            echo "107ce1b648285360e307d797e297f70d26ffd9810e626213616c024fadcbc28f  mpc-detection-to-bounce-count-slides/radio-graphslam-live/app.js" | sha256sum -c -
            echo "4dfddc81208696cd7b805d263f8d71c75cd31c6e48af2aca33c5f19701720a08  mpc-detection-to-bounce-count-slides/radio-slam-extra.mjs" | sha256sum -c -
            rm -rf scripts/radio-slam-payload
          else
            echo "Source payloads already materialized."
          fi

      - name: Patch deck generator
        run: node scripts/patch-radio-slam-slides.mjs

      - name: Correct joint radio GraphSLAM formulation
        run: node scripts/fix-radio-graphslam-slide.mjs

      - name: Correct GraphSLAM clutter-association notation
        run: node scripts/fix-radio-graphslam-clutter-notation.mjs

      - name: Insert bundle-adjustment bridge slide after GraphSLAM normalization
        run: node scripts/add-bundle-adjustment-slide.mjs

      - name: Insert detailed iSAM2 framing slides
        run: node scripts/add-isam2-slides.mjs

      - name: Correct iSAM2 bridge terminology
        run: node scripts/fix-isam2-label.mjs

      - name: Validate JavaScript syntax
        run: |
          node --check scripts/add-bundle-adjustment-slide.mjs
          node --check scripts/add-isam2-slides.mjs
          node --check scripts/fix-isam2-label.mjs
          node --check scripts/fix-radio-graphslam-slide.mjs
          node --check scripts/fix-radio-graphslam-clutter-notation.mjs
          node --check mpc-detection-to-bounce-count-slides/build.mjs
          node --check mpc-detection-to-bounce-count-slides/radio-slam-extra.mjs
          node --check mpc-detection-to-bounce-count-slides/radio-graphslam-live/app.js

      - name: Generate Bento deck
        run: node mpc-detection-to-bounce-count-slides/build.mjs

      - name: Verify slide sequence and live mounts
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'mpc-detection-to-bounce-count-slides/index.html'
          const html = fs.readFileSync(path, 'utf8')
          const opening = '<script type="application/bento+json" id="bento-doc">'
          const start = html.indexOf(opening)
          const end = start < 0 ? -1 : html.indexOf('</script>', start + opening.length)
          if (start < 0 || end < 0) throw new Error('Could not locate the Bento document JSON')
          const doc = JSON.parse(html.slice(start + opening.length, end).trim())
          const ids = doc.slides.map(slide => slide.id)
          const requiredIds = [
            's-radio-slam-s1',
            's-bp-slam-equations',
            's-bp-slam-live',
            's-pmbm-slam-equations',
            's-pmbm-slam-live',
            's-radio-bundle-adjustment',
            's-isam2-framing',
            's-isam2-bayes-tree',
            's-isam2-radio-factors',
            's-isam2-implementation',
            's-radio-graphslam-equations',
            's-radio-graphslam-live',
            's-radio-graphslam-iteration'
          ]
          for (const id of requiredIds) {
            if (!ids.includes(id)) throw new Error(`Missing required slide: ${id}`)
          }
          const orderedBridge = [
            's-radio-bundle-adjustment',
            's-isam2-framing',
            's-isam2-bayes-tree',
            's-isam2-radio-factors',
            's-isam2-implementation',
            's-radio-graphslam-equations'
          ]
          const bridgeIndices = orderedBridge.map(id => ids.indexOf(id))
          for (let i = 1; i < bridgeIndices.length; i += 1) {
            if (bridgeIndices[i] !== bridgeIndices[i - 1] + 1) {
              throw new Error(`Expected consecutive BA/iSAM2/GraphSLAM slides; got ${bridgeIndices.join(', ')}`)
            }
          }
          const requiredText = [
            'Bundle adjustment: the measurement-only core of joint radio SLAM',
            'Frame the radio-SLAM problem for iSAM2',
            'How iSAM2 updates the solution: edit the Bayes tree',
            'Translate radio geometry into sparse iSAM2 factors',
            'Implementation blueprint and evaluation plan',
            'SAME POSTERIOR AS BATCH BA / GRAPHSLAM',
            'Radio GraphSLAM: optimize the UE trajectory and radio map jointly',
            'full radio GraphSLAM optimizes both trajectory X and map M',
            'a=0 uses the clutter likelihood',
            'demo=bp',
            'demo=pmbm'
          ]
          for (const value of requiredText) {
            if (!html.includes(value)) throw new Error(`Missing required generated text: ${value}`)
          }
          if (html.includes('SAME POSTERIOR AS BATCH BA / GRAPHSAM')) {
            throw new Error('Legacy GraphSAM typo remains in the generated deck')
          }
          console.log(`Validated ${doc.slides.length} slides. BA/iSAM2/GraphSLAM pages: ${bridgeIndices.map(index => index + 1).join(' → ')}.`)
          NODE

      - name: Package deployable update
        run: |
          zip -qr radio-slam-slides-update.zip \
            mpc-detection-to-bounce-count-slides \
            scripts/patch-radio-slam-slides.mjs \
            scripts/add-bundle-adjustment-slide.mjs \
            scripts/add-isam2-slides.mjs \
            scripts/fix-isam2-label.mjs \
            scripts/fix-radio-graphslam-slide.mjs \
            scripts/fix-radio-graphslam-clutter-notation.mjs

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: radio-slam-slides-update
          path: radio-slam-slides-update.zip
          if-no-files-found: error

      - name: Remove local ZIP before committing
        run: rm -f radio-slam-slides-update.zip

      - name: Commit generated deck to source branch
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            scripts/add-bundle-adjustment-slide.mjs \
            scripts/add-isam2-slides.mjs \
            scripts/fix-isam2-label.mjs \
            scripts/fix-radio-graphslam-slide.mjs \
            scripts/fix-radio-graphslam-clutter-notation.mjs \
            mpc-detection-to-bounce-count-slides/build.mjs \
            mpc-detection-to-bounce-count-slides/index.html \
            mpc-detection-to-bounce-count-slides/radio-slam-extra.mjs \
            mpc-detection-to-bounce-count-slides/radio-graphslam-live \
            scripts/patch-radio-slam-slides.mjs
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Generate radio SLAM deck with iSAM2 framing"
            git push origin HEAD:"$TARGET_BRANCH"
          fi
