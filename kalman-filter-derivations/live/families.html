<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kalman derivation group experiments</title>
<style>
:root{color-scheme:light;--paper:#F7F5EF;--ink:#203129;--muted:#66756E;--line:#D8DED7;--a:#2F6B4F}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:15px/1.35 system-ui,sans-serif}button,input,select{font:inherit}button,select{border:1px solid var(--line);border-radius:7px;background:white;color:var(--ink);padding:6px 10px}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #496E87;outline-offset:2px}button.primary{background:var(--ink);color:white}#app{min-height:100vh;display:grid;grid-template-columns:292px minmax(0,1fr);gap:14px;padding:12px}aside,.stage{border:1px solid var(--line);border-radius:12px;background:#FFFEFB}aside{padding:12px;overflow:auto}.stage{padding:13px 16px;min-width:0;display:flex;flex-direction:column;gap:9px;overflow:auto}h1{font:700 21px/1.13 Georgia,serif;margin:4px 0 8px}h2{font-size:14px;margin:0}.eyebrow{font:700 10px/1.3 ui-monospace,monospace;color:var(--a);letter-spacing:.05em;margin:0}.intro{font-size:12.5px;color:var(--muted);margin:0 0 10px}.ctrl{margin:7px 0}.ctrl label{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:650}.ctrl input[type=range]{width:100%;accent-color:var(--a)}.ctrl select{width:100%;font-size:12px;margin-top:5px}.buttons{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0}.note{font-size:11.5px;color:var(--muted);margin:7px 0}.toolbar{display:flex;justify-content:space-between;gap:8px;align-items:center}.legend{font-size:10.5px;display:flex;gap:13px;flex-wrap:wrap}.legend span:before{content:'';display:inline-block;width:15px;height:3px;background:var(--mark);margin-right:5px;vertical-align:middle}.plot{width:100%;height:212px;min-height:150px;display:block}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.metric{border:1px solid var(--line);padding:7px 9px;border-radius:8px;min-width:0}.metric small{display:block;font-size:10.5px;color:var(--muted)}.metric strong{display:block;font:700 19px/1.25 ui-monospace,monospace;margin-top:4px}.explain{font-size:12px;line-height:1.38;background:#E7F0EA;border-radius:8px;padding:9px 12px}.matrix{font:12px/1.2 ui-monospace,monospace;border-collapse:collapse}.matrix td{padding:3px 9px;border:1px solid var(--line);text-align:right}.graph-extra{display:flex;gap:15px;align-items:center;font-size:12px}.graph-extra .matrix{font-size:11px}.graph-stage .plot{height:156px}footer{display:flex;justify-content:space-between;margin-top:8px;gap:6px}footer button{font-size:11px}.error{padding:30px;color:#92331b}body.embed #app{height:100vh;min-height:0}#heatmap{cursor:crosshair}@media(max-width:650px){#app{grid-template-columns:1fr;height:auto!important}aside{overflow:visible}.stage{min-height:440px}.plot{height:240px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style><script defer src="families.js"></script><script defer src="../../assets/bento-inline-frame.js"></script></head><body><main id="app"><p>Loading the deterministic experiment…</p></main><noscript>Enable JavaScript for the controls. The parent presentation includes a static fallback for every experiment.</noscript></body></html>
