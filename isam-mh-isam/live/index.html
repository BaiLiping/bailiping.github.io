<!doctype html>

<title>iSAM &amp; MH-iSAM2 · Interactive laboratories</title>
<meta name="description" content="Three deterministic teaching laboratories for incremental QR, Bayes-tree update locality, and multi-hypothesis pruning.">
<style>
:root{color-scheme:light;--paper:#f7f5ef;--panel:#fffefb;--ink:#203129;--muted:#66756e;--rule:#d8ded7;--green:#2f6b4f;--soft:#e7f0ea;--rust:#a94f2a;--warm:#f5e8df;--blue:#496e87;--cool:#e7eef3;--amber:#986b22}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:14px/1.4 Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button,select{border:1px solid var(--rule);border-radius:7px;background:var(--panel);color:var(--ink);padding:7px 10px}button{cursor:pointer;font-weight:700}button:hover{border-color:var(--green)}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}.primary{background:var(--green);color:#fff;border-color:var(--green)}a{color:var(--green)}nav{max-width:1200px;margin:18px auto;display:flex;justify-content:space-between;gap:12px;padding:0 16px}nav strong{font:700 22px/1.2 Georgia,serif}nav a{margin-left:13px;font-size:13px}main{max-width:1200px;margin:0 auto;padding:10px 12px}.embedded nav{display:none}.embedded main{max-width:none;padding:0}.lab{display:grid;grid-template-columns:290px minmax(0,1fr);gap:12px;height:475px}.controls,.card,.chart,.metrics,.message{border:1px solid var(--rule);border-radius:12px;background:var(--panel)}.controls{padding:14px;overflow:auto}.stage{display:grid;gap:10px;min-width:0}.qr .stage{grid-template-rows:335px 130px}.tree .stage{grid-template-rows:328px 137px}.mh .stage{grid-template-rows:276px 189px}.chart{padding:10px 12px;min-width:0;overflow:hidden}.chart svg{display:block;width:100%;height:calc(100% - 21px)}.eyebrow{color:var(--rust);font:800 10px/1.4 ui-monospace,monospace;letter-spacing:1px;text-transform:uppercase}h1{font:700 25px/1.12 Georgia,serif;margin:8px 0 10px}h2{font:800 11px/1.3 ui-monospace,monospace;color:var(--muted);margin:0 0 6px;letter-spacing:.6px;text-transform:uppercase}p{margin:8px 0;font-size:12px;color:var(--muted)}label.field{display:block;margin:12px 0 5px;font-size:12px;font-weight:700}label.field output{float:right;font-family:ui-monospace,monospace;color:var(--green)}input[type=range]{width:100%;accent-color:var(--green);margin:5px 0}select{width:100%;font-size:12px}.check{font-size:12px;display:flex;align-items:center;gap:7px;margin:10px 0}.check input{accent-color:var(--green)}.buttons{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.buttons button{font-size:12px;flex:1;white-space:nowrap}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;padding:10px 12px}.metric span{display:block;font-size:9px;text-transform:uppercase;color:var(--muted);letter-spacing:.4px}.metric strong{display:block;font:700 18px/1.25 ui-monospace,monospace;white-space:nowrap}.message{padding:10px 13px;font-size:12px;line-height:1.45;background:var(--soft)}.message.warning{background:var(--warm);border-color:var(--rust)}.mh .message{padding:7px 10px}.mh .card .hint{margin:5px 0}.legend{display:flex;flex-wrap:wrap;gap:11px;font-size:10px;color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.param{font:11px/1.7 ui-monospace,monospace;background:var(--paper);padding:7px 9px;border-radius:7px}.hint{font-size:10px;margin-top:7px}.mobile-nav{display:none}.embedded .mobile-nav{display:flex;justify-content:space-between;margin-top:8px}.mobile-nav button{font-size:10px;padding:3px 7px}.split{display:grid;grid-template-columns:1.25fr .75fr;gap:10px;min-width:0}.table-wrap{overflow:auto;max-height:118px}table{width:100%;border-collapse:collapse;font-size:10px}th,td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--rule)}th{color:var(--green);font-family:ui-monospace,monospace}.error{padding:24px;color:#8b2d20}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
svg text{fill:var(--ink);font-family:Inter,ui-sans-serif,sans-serif}.pause-overlay{display:none}.embedded[data-bento-paused="true"] .pause-overlay{display:block}
@media(min-width:900px){body:not(.embedded) main{padding:16px}body:not(.embedded) .lab{height:520px}body:not(.embedded) .qr .stage{grid-template-rows:375px 135px}body:not(.embedded) .tree .stage{grid-template-rows:370px 140px}body:not(.embedded) .mh .stage{grid-template-rows:315px 195px}}
@media(max-width:720px){nav{display:block}nav div{margin-top:8px}nav a{margin:0 12px 0 0}.lab{display:block;height:auto}.controls{overflow:visible;margin-bottom:12px}.stage{min-height:500px}.qr .stage,.tree .stage,.mh .stage{grid-template-rows:330px auto}.split{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.embedded .controls{max-height:none}.buttons button{min-height:38px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
