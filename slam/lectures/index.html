<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SLAM Lectures | Bai Liping</title>
    <meta name="description" content="Watch Princeton Introduction to Robotics lectures on occupancy-grid SLAM, visual SLAM, and SLAM with VGGT.">
    <link rel="canonical" href="https://bailiping.com/slam/lectures/">
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/assets/home.css">
    <style>
      .breadcrumbs { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; font-size: 14px; }
      .breadcrumbs span, .course { color: var(--muted); }
      h1 { color: var(--ink); }
      .course { margin: 0; }
      .lecture { margin-top: 32px; border-top: 1px solid var(--line); padding-top: 20px; scroll-margin-top: 16px; }
      .lecture-heading { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 4px 18px; margin-bottom: 12px; }
      .lecture-number { display: block; margin-bottom: 4px; color: var(--muted); font: 400 12px/1.4 var(--mono); }
      .lecture-heading a { font-size: 14px; }
      .lecture a:hover, .breadcrumbs a:hover { text-decoration: underline; text-underline-offset: .18em; }
      .lecture iframe { display: block; width: 100%; height: auto; min-height: 200px; aspect-ratio: 16 / 9; border: 0; border-radius: 4px; background: #141414; }
      @media (max-width: 580px) {
        .lecture-heading { flex-direction: column; align-items: flex-start; }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <nav class="breadcrumbs" aria-label="Breadcrumb">
        <a href="/">Bai Liping</a>
        <span aria-hidden="true">/</span>
        <a href="/#slam">SLAM</a>
      </nav>
      <h1>Lectures</h1>
      <p class="course">Princeton Introduction to Robotics · Fall 2026</p>
    </header>
    <main>
      <section class="lecture" id="lecture-13" aria-labelledby="title-13">
        <div class="lecture-heading">
          <h2 class="group-title" id="title-13"><span class="lecture-number">Lecture 13</span>Occupancy-Grid SLAM</h2>
          <a href="https://www.youtube.com/watch?v=3r22OMZiQ4Y" aria-label="Watch Lecture 13 on YouTube">Watch on YouTube</a>
        </div>
        <iframe width="800" height="450" src="https://www.youtube-nocookie.com/embed/3r22OMZiQ4Y"
          title="Lecture 13 · Occupancy-Grid SLAM" referrerpolicy="strict-origin-when-cross-origin"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      </section>

      <section class="lecture" id="lecture-14" aria-labelledby="title-14">
        <div class="lecture-heading">
          <h2 class="group-title" id="title-14"><span class="lecture-number">Lecture 14</span>Visual SLAM</h2>
          <a href="https://www.youtube.com/watch?v=kl1KSSXlIfI" aria-label="Watch Lecture 14 on YouTube">Watch on YouTube</a>
        </div>
        <iframe width="800" height="450" src="https://www.youtube-nocookie.com/embed/kl1KSSXlIfI" loading="lazy"
          title="Lecture 14 · Visual SLAM" referrerpolicy="strict-origin-when-cross-origin"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      </section>

      <section class="lecture" id="lecture-15" aria-labelledby="title-15">
        <div class="lecture-heading">
          <h2 class="group-title" id="title-15"><span class="lecture-number">Lecture 15</span>SLAM with VGGT</h2>
          <a href="https://www.youtube.com/watch?v=7OfZbaIZzks" aria-label="Watch Lecture 15 on YouTube">Watch on YouTube</a>
        </div>
        <iframe width="800" height="450" src="https://www.youtube-nocookie.com/embed/7OfZbaIZzks" loading="lazy"
          title="Lecture 15 · SLAM with VGGT" referrerpolicy="strict-origin-when-cross-origin"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      </section>
      <footer class="site-footer"><a href="/site-map/">All pages</a></footer>
    </main>
