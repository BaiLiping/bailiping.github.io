engine-3q.webp", "outline": "comparisons/current/detail-mech-engine-3q-outline.png"}, {"id": "detail-mech-pdk-emotor", "label": "Powertrain \u00b7 8-speed hybrid PDK (CDU.50) & 60 kW PMSM electric motor", "source": "https://newsroom.porsche.com/en/press-kits/pfv-porsche-911-turbo-s/Powertrain.html", "status": "limited", "credit": "Porsche AG (factory technical illustration 323520)", "original_url": "https://github.com/BaiLiping/Car_Photos/blob/e9c211d5cfdeb8350622092f9de5cbbf69bf5343/Porsche%20911%20Turbo%20S%20Cabriolet/Factory%20schematics/Turbo%20S%20mechanical%20illustrations/Hybrid%20transmission%20and%20electric%20motor.jpg", "note": "The separated electric motor and ribbed PDK case follow the illustration. Phase leads are modeled and the visible case carries photographic surface detail. Rear motor casing and internal tooth profiles are approximate. Visible assembly mask overlap 84.8%.", "camera": "source/cameras.json#detail-mech-pdk-emotor", "photo": "porsche-views/detail-mech-pdk-emotor.webp", "width": 3840, "height": 2160, "render": "comparisons/current/detail-mech-pdk-emotor.webp", "outline": "comparisons/current/detail-mech-pdk-emotor-outline.png"}, {"id": "detail-mech-chassis-front", "label": "Powertrain \u00b7 Rolling chassis, AWD & 400V HV routing (front-left 3/4)", "source": "https://newsroom.porsche.com/en/press-kits/pfv-porsche-911-turbo-s/Powertrain.html", "status": "limited", "credit": "Porsche AG (factory technical illustration 323530)", "original_url": "https://github.com/BaiLiping/Car_Photos/blob/e9c211d5cfdeb8350622092f9de5cbbf69bf5343/Porsche%20911%20Turbo%20S%20Cabriolet/Factory%20schematics/Turbo%20S%20mechanical%20illustrations/Rolling%20chassis%20and%20electrical%20routing%20-%20view%201.jpg", "note": "Wheelbase, powertrain location and the longitudinal electrical route register in this view. The small brackets, hose bundles, battery housing and unpictured faces are simplified. Visible assembly mask overlap 79.6%.", "camera": "source/cameras.json#detail-mech-chassis-front", "photo": "porsche-views/detail-mech-chassis-front.webp", "width": 6000, "height": 3164, "render": "comparisons/current/detail-mech-chassis-front.webp", "outline": "comparisons/current/detail-mech-chassis-front-outline.png"}, {"id": "detail-mech-chassis-rear", "label": "Powertrain \u00b7 Rolling chassis, AWD & 400V HV routing (rear-left 3/4)", "source": "https://newsroom.porsche.com/en/press-kits/pfv-porsche-911-turbo-s/Powertrain.html", "status": "limited", "credit": "Porsche AG (factory technical illustration 323532)", "original_url": "https://github.com/BaiLiping/Car_Photos/blob/e9c211d5cfdeb8350622092f9de5cbbf69bf5343/Porsche%20911%20Turbo%20S%20Cabriolet/Factory%20schematics/Turbo%20S%20mechanical%20illustrations/Rolling%20chassis%20and%20electrical%20routing%20-%20view%202.jpg", "note": "Wheelbase, powertrain location and the longitudinal electrical route register in this view. The small brackets, hose bundles, battery housing and unpictured faces are simplified. Visible assembly mask overlap 80.0%.", "camera": "source/cameras.json#detail-mech-chassis-rear", "photo": "porsche-views/detail-mech-chassis-rear.webp", "width": 6000, "height": 3164, "render": "comparisons/current/detail-mech-chassis-rear.webp", "outline": "comparisons/current/detail-mech-chassis-rear-outline.png"}, {"id": "detail-cabin-dash", "label": "Cabin \u00b7 Dashboard, curved digital cluster & console", "source": "https://configurator.porsche.com/en-US/mode/model/992652?options=1A&viz-mode=3d&prs-environment=Whiteroom+Porsche", "status": "verified", "credit": "Porsche AG (configurator render)", "original_url": "https://github.com/BaiLiping/Car_Photos/blob/e9c211d5cfdeb8350622092f9de5cbbf69bf5343/Porsche%20911%20Turbo%20S%20Cabriolet/911%20Turbo%20S%20Cabriolet%20%2847%29.jpeg", "note": "Checked the steering hub, dashboard screen, clock and selector. This camera hides the front seats to reproduce the unobstructed factory dashboard view. The rim buttons and switch legends are approximate.", "camera": "source/cameras.json#detail-cabin-dash", "photo": "porsche-views/detail-cabin-dash.webp", "width": 3840, "height": 2160, "render": "comparisons/current/detail-cabin-dash.webp", "outline": "comparisons/current/detail-cabin-dash-outline.png"}, {"id": "detail-cabin-seats-front", "label": "Cabin \u00b7 Front 18-way Sport Seats Plus & rear 2+2 seats", "source": "https://configurator.porsche.com/en-US/mode/model/992652?options=1A&viz-mode=3d&prs-environment=Whiteroom+Porsche", "status": "fix", "credit": "Porsche AG (configurator render)", "original_url": "https://github.com/BaiLiping/Car_Photos/blob/e9c211d5cfdeb8350622092f9de5cbbf69bf5343/Porsche%20911%20Turbo%20S%20Cabriolet/911%20Turbo%20S%20Cabriolet%20%2848%29.jpeg", "note": "Both front seat backs, headrests and the central armrest are visible. The shoulders and side-bolster sections are flatter than the photograph.", "camera": "source/cameras.json#detail-cabin-seats-front", "photo": "porsche-views/detail-cabin-seats-front.webp", "width": 3840, "height": 2160, "render": "comparisons/current/detail-cabin-seats-front.webp", "outline": "comparisons/current/detail-cabin-seats-front-outline.png"}, {"id": "detail-cabin-seats-rear", "label": "Cabin \u00b7 Rear seats & cockpit from right-rear", "source": "https://configurator.porsche.com/en-US/mode/model/992652?options=1A&viz-mode=3d&prs-environment=Whiteroom+Porsche", "status": "limited", "credit": "Porsche AG (configurator render)", "original_url": "https://github.com/BaiLiping/Car_Photos/blob/e9c211d5cfdeb8350622092f9de5cbbf69bf5343/Porsche%20911%20Turbo%20S%20Cabriolet/911%20Turbo%20S%20Cabriolet%20%2849%29.jpeg", "note": "The rear cushions, front seat back and steering position register. The quilt seams, belts and concealed side trim have partial reference coverage.", "camera": "source/cameras.json#detail-cabin-seats-rear", "photo": "porsche-views/detail-cabin-seats-rear.webp", "width": 3840, "height": 2160, "render": "comparisons/current/detail-cabin-seats-rear.webp", "outline": "comparisons/current/detail-cabin-seats-rear-outline.png"}, {"id": "studio-57-dup", "label": "Roof open \u00b7 Front-left three-quarter (near-duplicate of view-43)", "source": "https://configurator.porsche.com/en-US/mode/model/992652?options=1A&viz-mode=3d&prs-environment=Whiteroom+Porsche", "status": "excluded", "credit": "Porsche AG (configurator render)", "original_url": "https://github.com/BaiLiping/Car_Photos/blob/e9c211d5cfdeb8350622092f9de5cbbf69bf5343/Porsche%20911%20Turbo%20S%20Cabriolet/911%20Turbo%20S%20Cabriolet%20%2857%29.jpeg", "note": "Near-duplicate of the roof-down front three-quarter frame view-43."}, {"id": "detail-mech-eturbo-cutaway", "label": "Powertrain \u00b7 Electric turbocharger (eTurbo) cutaway", "source": "https://newsroom.porsche.com/en/press-kits/pfv-porsche-911-turbo-s/Powertrain.html", "status": "limited", "credit": "Porsche AG (factory technical illustration 323523)", "original_url": "https://github.com/BaiLiping/Car_Photos/blob/e9c211d5cfdeb8350622092f9de5cbbf69bf5343/Porsche%20911%20Turbo%20S%20Cabriolet/Factory%20schematics/Turbo%20S%20mechanical%20illustrations/Electric%20turbocharger%20cutaway.jpg", "note": "Factory sectional illustration used for the motor and turbine. The viewer displays the assembled turbocharger. The exact section plane and internal passages are unavailable.", "photo": "comparisons/current/detail-mech-eturbo-cutaway-reference.webp", "width": 6000, "height": 3375}, {"id": "detail-mech-chassis-awd", "label": "Powertrain \u00b7 Rolling chassis mechanical AWD driveline (HV hidden)", "source": "https://newsroom.porsche.com/en/press-kits/pfv-porsche-911-turbo-s/Powertrain.html", "status": "limited", "credit": "Porsche AG (factory technical illustration 323531)", "original_url": "https://github.com/BaiLiping/Car_Photos/blob/e9c211d5cfdeb8350622092f9de5cbbf69bf5343/Porsche%20911%20Turbo%20S%20Cabriolet/Mechanical/Drivetrain%20and%20connections/Rolling%20chassis%20-%20mechanical%20driveshaft%20routing.jpg", "note": "Supplementary mechanical AWD illustration with electrical components removed. The two rolling-chassis gallery cameras show the complete factory presentation.", "photo": "comparisons/current/detail-mech-chassis-awd-reference.webp", "width": 6000, "height": 3164}, {"id": "detail-mech-cutaway-front", "label": "Powertrain \u00b7 Full vehicle cutaway (front-left 3/4, Coupe body)", "source": "https://newsroom.porsche.com/en/press-kits/pfv-porsche-911-turbo-s/Powertrain.html", "status": "excluded", "credit": "Porsche AG (factory technical illustration 323526)", "original_url": "https://github.com/BaiLiping/Car_Photos/blob/e9c211d5cfdeb8350622092f9de5cbbf69bf5343/Porsche%20911%20Turbo%20S%20Cabriolet/Mechanical/Drivetrain%20and%20connections/Factory%20cutaway%20-%20engine%20to%20front%20axle.jpg", "note": "This factory cutaway has a Coup\u00e9 body. It supplies mechanical context for the shared powertrain."}, {"id": "detail-mech-cutaway-rear", "label": "Powertrain \u00b7 Rear engine bay cutaway (high rear-left 3/4, Coupe body)", "source": "https://newsroom.porsche.com/en/press-kits/pfv-porsche-911-turbo-s/Powertrain.html", "status": "excluded", "credit": "Porsche AG (factory technical illustration 323527)", "original_url": "https://github.com/BaiLiping/Car_Photos/blob/e9c211d5cfdeb8350622092f9de5cbbf69bf5343/Porsche%20911%20Turbo%20S%20Cabriolet/Mechanical/Engine%20and%20turbos/Factory%20cutaway%20-%20rear%20engine%20compartment.jpg", "note": "The rear cutaway shows the Coup\u00e9 roof and engine bay. The Cabriolet has a different rear body and hood mechanism."}, {"id": "detail-cab-engine-bay", "label": "Engine bay \u00b7 Open rear service lid & twin cooling fans (real 2026 Cabriolet)", "source": "https://collectingcars.com/for-sale/2026-porsche-911-992-2-turbo-s-cabriolet", "status": "excluded", "credit": "Collecting Cars / lot 090655 (real 2026 Cabriolet photograph)", "original_url": "https://github.com/BaiLiping/Car_Photos/blob/e9c211d5cfdeb8350622092f9de5cbbf69bf5343/Porsche%20911%20Turbo%20S%20Cabriolet/Mechanical/Engine%20and%20turbos/Cabriolet%20-%20engine%20bay%20fans%20from%20above.jpg", "note": "Independently photographed Cabriolet service bay. The acquisition record permits a source link and does not grant rehosting rights."}, {"id": "detail-ortho-side-factory", "label": "Factory orthographic benchmark \u00b7 Right side profile (roof open, black promo spec)", "source": "https://www.porsche.com/usa/models/911/911-turbo-models/911-turbo-s-cabriolet/", "status": "limited", "credit": "Porsche AG (official 992652 side profile render)", "original_url": "https://github.com/BaiLiping/Car_Photos/blob/e9c211d5cfdeb8350622092f9de5cbbf69bf5343/Porsche%20911%20Turbo%20S%20Cabriolet/Factory%20schematics/Porsche%20-%20Turbo%20S%20Cabriolet%20side%20view.png", "note": "Factory side profile in alternative trim. With both hubs held fixed, the perspective-fit outline overlap is 95.1%. The windscreen header and outer bumper corners give the largest visible discrepancies.", "photo": "comparisons/current/detail-ortho-side-factory-reference.webp", "width": 5000, "height": 1485}], "counts": {"verified": 44, "limited": 11, "pending": 0, "fix": 10, "excluded": 4}}</script>
<script>
  "use strict";
  const byId = id => document.getElementById(id);
  const report = JSON.parse(byId("data").textContent);
  const frames = report.frames;
  const frameSelect = byId("frame");
  const mode = byId("mode");
  const native = byId("native");
  const amount = byId("amount");
  const images = byId("images");
  const photoPane = byId("photoPane");
  const modelPane = byId("modelPane");
  let index = 0;
  let preferredMode = "pair";

  document.title = report.vehicle + " · Photo review";
  byId("vehicle").textContent = report.vehicle;
  const counts = Object.entries(report.counts).map(([status, n]) => n + " " + (status === "fix" ? "to fix" : status));
  byId("coverage").textContent = "Build " + report.revision + " · " + counts.join(" · ");
  frames.forEach((f, i) => frameSelect.add(new Option((i + 1) + "/" + frames.length + " · " + f.id + " · " + f.label, i)));

  function setImage(id, path) {
    const image = byId(id);
    if (path) image.setAttribute("src", path);
    else image.removeAttribute("src");
  }

  function setLink(id, path) {
    const link = byId(id);
    link.hidden = !path;
    if (path) link.setAttribute("href", path);
    else link.removeAttribute("href");
  }

  function adjustLayer() {
    const value = Number(amount.value);
    const wipe = mode.value === "wipe";
    const layer = byId("layer");
    layer.style.opacity = wipe ? 1 : value / 100;
    layer.style.clipPath = wipe ? "inset(0 0 0 " + value + "%)" : "none";
    byId("divider").style.left = value + "%";
  }

  function showMode() {
    const frame = frames[index];

    const paired = mode.value === "pair";
    const layered = !paired && Boolean(frame.render);
    images.classList.toggle("paired", paired && Boolean(frame.render));
    images.classList.toggle("native", native.checked);
    byId("modelFigure").hidden = !paired || !frame.render;
    byId("layer").hidden = !layered;
    byId("sliderLabel").hidden = !layered;
    byId("divider").hidden = !layered || mode.value !== "wipe";
    byId("sliderTitle").textContent = mode.value === "wipe" ? "Divider" : "Opacity";
    const captions = {pair: "Reference photo", wipe: "Photo / model wipe", blend: "Model over photo", outline: "Mesh outline over photo"};
    byId("caption").textContent = captions[mode.value];
    setImage("layer", layered ? (mode.value === "outline" ? frame.outline : frame.render) : null);
    adjustLayer();
    if (paired) syncPan(photoPane, modelPane);
  }

  function showFrame() {
    const old = {'ext-low-front-left':'view-00','ext-low-front':'view-35','ext-low-side-left':'view-04','ext-low-side-right':'view-25','ext-low-rear-left':'view-06','ext-low-rear-right':'view-19','ext-low-rear':'view-12','ext-high-rear-left':'view-50','ext-low-front-left-wheel':'detail-wheel-pccb-fl','dashboard':'detail-cabin-dash','front-seats':'detail-cabin-seats-front','rear-seats':'detail-cabin-seats-rear'};
    const archive = ['ascari-top-down','provence-front','provence-rear','ice-grey-profile','provence-overhead'];
    const raw = location.hash.slice(1);
    if (archive.includes(raw)) { location.replace('./comparisons/earlier-review.html#'+raw); return; }
    const hash = old[raw] || raw;
    index = Math.max(0, frames.findIndex(f => encodeURIComponent(f.id) === hash));
    const frame = frames[index];
    const live = byId('liveCompare');
    live.hidden = !frame.render;
    live.href = './?frame='+encodeURIComponent(frame.id)+'&compare=1#porsche-views';
    frameSelect.selectedIndex = index;
    byId("previous").disabled = index === 0;
    byId("next").disabled = index === frames.length - 1;
    byId("photoFigure").hidden = !frame.photo;
    native.disabled = !frame.photo;
    mode.disabled = !frame.render;
    mode.querySelector('[value="outline"]').disabled = !frame.outline;
    mode.value = frame.render && (preferredMode !== "outline" || frame.outline) ? preferredMode : "pair";
    images.style.setProperty("--native-width", (frame.width || 1) + "px");
    images.style.setProperty("--aspect", (frame.width || 1) / (frame.height || 1));
    setImage("photo", frame.photo);
    setImage("model", frame.render);
    byId("photo").alt = frame.label + " reference";
    byId("model").alt = frame.label + " model render";
    for (const pane of [photoPane, modelPane]) pane.scrollTo(0, 0);
    byId("verdict").textContent = [frame.status, frame.width && (frame.width + " × " + frame.height), frame.camera].filter(Boolean).join(" · ");
    byId("note").textContent = frame.note;
    const source = byId("source");
    source.textContent = [frame.source, frame.credit].filter(Boolean).join(" · ");
    if (/^https?:\/\//i.test(frame.source)) {
      const link = document.createElement("a");
      link.href = frame.source;
      link.textContent = frame.credit || "Source";
      source.replaceChildren(link);
    }
    setLink("onlineOriginal", /^https?:\/\//i.test(frame.original_url) ? frame.original_url : null);
    setLink("original", frame.photo);
    setLink("capture", frame.render);
    showMode();
  }

  function go(to) {
    if (to >= 0 && to < frames.length) location.hash = encodeURIComponent(frames[to].id);
  }

  function syncPan(from, to) {
    if (!native.checked || !images.classList.contains("paired")) return;
    if (to.scrollLeft !== from.scrollLeft) to.scrollLeft = from.scrollLeft;
    if (to.scrollTop !== from.scrollTop) to.scrollTop = from.scrollTop;
  }

  byId("previous").onclick = () => go(index - 1);
  byId("next").onclick = () => go(index + 1);
  frameSelect.onchange = () => go(frameSelect.selectedIndex);
  mode.onchange = () => { preferredMode = mode.value; showMode(); };
  native.onchange = showMode;
  amount.oninput = adjustLayer;
  photoPane.onscroll = () => syncPan(photoPane, modelPane);
  modelPane.onscroll = () => syncPan(modelPane, photoPane);
  window.addEventListener("hashchange", showFrame);
  document.addEventListener("keydown", event => {
    if (event.altKey || event.ctrlKey || event.metaKey || event.target.matches("input, select, textarea")) return;
    if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
    event.preventDefault();
    go(index + (event.key === "ArrowRight" ? 1 : -1));
  });
  showFrame();
</script>
