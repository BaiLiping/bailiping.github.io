ng Cars / lot 090655 (real 2026 Cabriolet photograph)", "original_url": "", "note": "Independently photographed Cabriolet service bay. The acquisition record permits a source link and does not grant rehosting rights."}, {"id": "detail-ortho-side-factory", "label": "Factory orthographic benchmark \u00b7 Right side profile (roof open, black promo spec)", "source": "https://www.porsche.com/usa/models/911/911-turbo-models/911-turbo-s-cabriolet/", "status": "limited", "credit": "Porsche AG (official 992652 side profile render)", "original_url": "", "note": "Factory side profile in alternative trim. With both hubs held fixed, the perspective-fit outline overlap is 95.4%. The windscreen header and outer bumper corners give the largest visible discrepancies."}], "counts": {"verified": 48, "limited": 11, "pending": 0, "fix": 6, "excluded": 4}}</script>
<script>
  "use strict";
  const byId = id => document.getElementById(id);
  const report = JSON.parse(byId("data").textContent);
  const frames = report.frames;
  const frameSelect = byId("frame");
  const mode = byId("mode");
  const native = byId("native");
  const amount = byId("amount");
  const images = byId("images");
  const photoPane = byId("photoPane");
  const modelPane = byId("modelPane");
  let index = 0;
  let preferredMode = "pair";

  document.title = report.vehicle + " · Photo review";
  byId("vehicle").textContent = report.vehicle;
  const counts = Object.entries(report.counts).map(([status, n]) => n + " " + (status === "fix" ? "to fix" : status));
  byId("coverage").textContent = "Build " + report.revision + " · " + counts.join(" · ");
  frames.forEach((f, i) => frameSelect.add(new Option((i + 1) + "/" + frames.length + " · " + f.id + " · " + f.label, i)));

  function setImage(id, path) {
    const image = byId(id);
    if (path) image.setAttribute("src", path);
    else image.removeAttribute("src");
  }

  function setLink(id, path) {
    const link = byId(id);
    link.hidden = !path;
    if (path) link.setAttribute("href", path);
    else link.removeAttribute("href");
  }

  function adjustLayer() {
    const value = Number(amount.value);
    const wipe = mode.value === "wipe";
    const layer = byId("layer");
    layer.style.opacity = wipe ? 1 : value / 100;
    layer.style.clipPath = wipe ? "inset(0 0 0 " + value + "%)" : "none";
    byId("divider").style.left = value + "%";
  }

  function showMode() {
    const frame = frames[index];
    const paired = mode.value === "pair";
    const layered = !paired && Boolean(frame.render);
    images.classList.toggle("paired", paired && Boolean(frame.render));
    images.classList.toggle("native", native.checked);
    byId("modelFigure").hidden = !paired || !frame.render;
    byId("layer").hidden = !layered;
    byId("sliderLabel").hidden = !layered;
    byId("divider").hidden = !layered || mode.value !== "wipe";
    byId("sliderTitle").textContent = mode.value === "wipe" ? "Divider" : "Opacity";
    const captions = {pair: "Reference photo", wipe: "Photo / model wipe", blend: "Model over photo", outline: "Mesh outline over photo"};
    byId("caption").textContent = captions[mode.value];
    setImage("layer", layered ? (mode.value === "outline" ? frame.outline : frame.render) : null);
    adjustLayer();
    if (paired) syncPan(photoPane, modelPane);
  }

  function showFrame() {
    const hash = location.hash.slice(1);
    index = Math.max(0, frames.findIndex(f => encodeURIComponent(f.id) === hash));
    const frame = frames[index];
    frameSelect.selectedIndex = index;
    byId("previous").disabled = index === 0;
    byId("next").disabled = index === frames.length - 1;
    byId("photoFigure").hidden = !frame.photo;
    native.disabled = !frame.photo;
    mode.disabled = !frame.render;
    mode.querySelector('[value="outline"]').disabled = !frame.outline;
    mode.value = frame.render && (preferredMode !== "outline" || frame.outline) ? preferredMode : "pair";
    images.style.setProperty("--native-width", (frame.width || 1) + "px");
    images.style.setProperty("--aspect", (frame.width || 1) / (frame.height || 1));
    setImage("photo", frame.photo);
    setImage("model", frame.render);
    byId("photo").alt = frame.label + " reference";
    byId("model").alt = frame.label + " model render";
    for (const pane of [photoPane, modelPane]) pane.scrollTo(0, 0);
    byId("verdict").textContent = [frame.status, frame.width && (frame.width + " × " + frame.height), frame.camera].filter(Boolean).join(" · ");
    byId("note").textContent = frame.note;
    const source = byId("source");
    source.textContent = [frame.source, frame.credit].filter(Boolean).join(" · ");
    if (/^https?:\/\//i.test(frame.source)) {
      const link = document.createElement("a");
      link.href = frame.source;
      link.textContent = frame.credit || "Source";
      source.replaceChildren(link);
    }
    setLink("onlineOriginal", /^https?:\/\//i.test(frame.original_url) ? frame.original_url : null);
    setLink("original", frame.photo);
    setLink("capture", frame.render);
    showMode();
  }

  function go(to) {
    if (to >= 0 && to < frames.length) location.hash = encodeURIComponent(frames[to].id);
  }

  function syncPan(from, to) {
    if (!native.checked || !images.classList.contains("paired")) return;
    if (to.scrollLeft !== from.scrollLeft) to.scrollLeft = from.scrollLeft;
    if (to.scrollTop !== from.scrollTop) to.scrollTop = from.scrollTop;
  }

  byId("previous").onclick = () => go(index - 1);
  byId("next").onclick = () => go(index + 1);
  frameSelect.onchange = () => go(frameSelect.selectedIndex);
  mode.onchange = () => { preferredMode = mode.value; showMode(); };
  native.onchange = showMode;
  amount.oninput = adjustLayer;
  photoPane.onscroll = () => syncPan(photoPane, modelPane);
  modelPane.onscroll = () => syncPan(modelPane, photoPane);
  window.addEventListener("hashchange", showFrame);
  document.addEventListener("keydown", event => {
    if (event.altKey || event.ctrlKey || event.metaKey || event.target.matches("input, select, textarea")) return;
    if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
    event.preventDefault();
    go(index + (event.key === "ArrowRight" ? 1 : -1));
  });
  showFrame();
</script>
