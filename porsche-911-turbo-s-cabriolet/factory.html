<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Factory 360° · Porsche 911 Turbo S Cabriolet | Bai Liping</title>
<link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/assets/car-studio/studio.css">
<style>
nav{flex-wrap:wrap}main{width:100%;background:#f1f2f3}.images{flex:1;min-height:0;position:relative;line-height:0;touch-action:pan-y;cursor:ew-resize;user-select:none}.images img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}#comparison{z-index:1}
footer{display:grid;justify-items:center;gap:7px;padding:8px 12px max(14px,env(safe-area-inset-bottom));background:#fbfaf7;border-top:1px solid #d6d8d7}
footer div{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}output,.credit{font-size:13px;color:#465761}input[type=range]{width:min(26vw,230px);accent-color:#293c47}
#match,button{border:1px solid #c7cecf;border-radius:5px;padding:6px 11px;text-decoration:none;font-size:14px}#match{background:#293c47;color:white}#readout{min-width:6em;text-align:center}#blending label{font-size:13px;margin:0}
[hidden]{display:none!important}#failure{position:absolute;left:0;right:0;text-align:center;top:45%}@media(max-width:550px){header nav{gap:10px;font-size:12px}footer{padding:7px 6px;gap:5px}footer div{gap:5px}.credit{font-size:12px}}
</style></head>
<body style="--paint:#223750">
<header><div class="identity"><a class="back" href="/cars/">Cars</a><h1>2027 Porsche 911 Turbo S Cabriolet</h1><span class="paint">Gentian Blue Metallic</span></div>
<nav aria-label="Studio views"><a href="./#model">3D model</a><a href="./#powertrain">Powertrain</a><a aria-current="page" href="factory.html">Factory 360°</a><a href="review.html">Photo comparisons</a></nav></header>
<main><div class="images" tabindex="0" aria-label="Porsche factory exterior. Drag horizontally or use left and right arrow keys to rotate."><img id="photo" alt=""><img id="comparison" alt="Matched 3D model overlay" hidden><p id="failure" hidden></p></div>
<footer><div><select id="collection" aria-label="Factory view collection"><option value="orbit">Exterior 360°</option><option value="details">Factory details</option></select><button id="prev" aria-label="Previous angle">‹</button><input id="angle" type="range" min="1" max="1" value="1" step="1" aria-label="Exterior angle"><button id="next" aria-label="Next angle">›</button><output id="readout" for="angle"></output><button id="compare" aria-controls="blending" aria-pressed="false">Compare</button><a id="match" href="./#model">Match in 3D</a></div>
<div id="blending" hidden><label for="opacity">Model opacity</label><input id="opacity" type="range" min="0" max="100" value="65"><span class="credit" id="alignment"></span></div>
<div class="credit"><a href="https://configurator.porsche.com/en-US/mode/model/992652?options=1A&amp;viz-mode=3d&amp;prs-environment=Whiteroom+Porsche">Porsche configurator</a><span aria-hidden="true">·</span><a id="full" href="factory-360/">Open image</a></div></footer></main>
<script type="module">
const byId=id=>document.getElementById(id), image=byId('photo'), model=byId('comparison'), angle=byId('angle');
const stage=document.querySelector('.images');
try {
  const [manifest,cameras]=await Promise.all(['frames','cameras'].map(async name=>
    (await fetch('factory-360/'+name+'.json?v=5db30747cb97')).json()));
  const matched=new Map(cameras.map(v=>[v.id,v]));
  const sets={orbit:manifest.frames,details:manifest.details || []},collection=byId('collection');
  const base='factory-360/', preloaded=new Map(),entry=location.hash.slice(1);
  if(!sets.details.length)collection.hidden=true;
  if(sets.details.some(f=>f.id===entry))collection.value='details';
  let frames=sets[collection.value],index=Math.max(0,frames.findIndex(f=>f.id===entry)),comparing=false,drag;
  function url(file){return base+file+'?v=5db30747cb97';}
  function display(next,updateLink=true){
    index=(next%frames.length+frames.length)%frames.length;
    const f=frames[index],src=url(f.image);
    image.src=src;image.alt='Porsche factory view · '+f.label;
    byId('readout').textContent=f.label+' · '+(index+1)+' / '+frames.length;
    angle.value=index+1;angle.setAttribute('aria-valuetext',f.label);
    byId('match').href='./?frame='+encodeURIComponent(f.id)+'#model';byId('full').href=src;
    const hasMatch=matched.has(f.id),fit=matched.get(f.id)?.registration;
    byId('alignment').textContent=fit?.outlineMedianPx!=null
      ? 'Median outline difference '+fit.outlineMedianPx.toFixed(1)+' px at '+fit.sampleWidth+' px wide' : '';
    byId('match').hidden=!hasMatch;byId('compare').hidden=!hasMatch;
    byId('blending').hidden=!comparing||!hasMatch;model.hidden=true;
    if(comparing && hasMatch){
      model.src=url('model/'+f.id+'.webp');
      // A fast swipe can finish a previous download after the next angle is selected.
      Promise.all([image.decode(),model.decode()]).then(()=>{
        if(comparing && frames[index].id===f.id)model.hidden=false;
      }).catch(()=>{});
    }
    if(updateLink)history.replaceState(null,'','#'+f.id);
    for(const j of [-1,1]){
      const adjacent=frames[(index+j+frames.length)%frames.length];
      if(!preloaded.has(adjacent.id)){
        const img=new Image();img.src=url(adjacent.image);preloaded.set(adjacent.id,img);
        if(preloaded.size>6)preloaded.delete(preloaded.keys().next().value);
      }
    }
  }
  collection.onchange=()=>{frames=sets[collection.value];index=0;angle.max=frames.length;display(0);};
  angle.max=frames.length;angle.oninput=()=>display(Number(angle.value)-1);
  byId('prev').onclick=()=>display(index-1);byId('next').onclick=()=>display(index+1);
  byId('compare').onclick=()=>{
    comparing=!comparing;byId('compare').setAttribute('aria-pressed',String(comparing));
    byId('blending').hidden=!comparing;model.hidden=!comparing;display(index,false);
  };
  const opacity=byId('opacity');opacity.oninput=()=>{model.style.opacity=opacity.value/100};opacity.oninput();
  stage.onpointerdown=e=>{if(e.button!==0||!e.isPrimary)return;stage.setPointerCapture(e.pointerId);drag={id:e.pointerId,x:e.clientX,index};};
  stage.onpointermove=e=>{
    if(drag?.id!==e.pointerId)return;
    const next=drag.index+Math.round((drag.x-e.clientX)/Math.max(12,stage.clientWidth/frames.length));
    if((next%frames.length+frames.length)%frames.length!==index)display(next);
  };
  stage.onlostpointercapture=()=>{drag=null;};
  stage.onkeydown=e=>{
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();display(index+(e.key==='ArrowLeft'?-1:1));}
  };
  display(index,false);
} catch(e){byId('failure').textContent='The factory images could not load. Open the Porsche configurator below.';byId('failure').hidden=false;console.error(e);}
</script></body></html>
