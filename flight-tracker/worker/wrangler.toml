name = "bailiping-flight-tracker"
main = "worker.mjs"
compatibility_date = "2026-10-30"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://bailiping.com"
OPENAI_MODEL = "gpt-6-astra"
MAX_DAILY_CHECKS = "10"

[[durable_objects.bindings]]
name = "LIVE_CHECKS"
class_name = "LiveChecks"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveChecks"]

[secrets]
required = ["OPENAI_API_KEY"]
