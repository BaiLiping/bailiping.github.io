<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>VI & EM · Interactive laboratories</title>
<meta name="description" content="Two interactive experiments: mean-field Gaussian geometry and exact Gaussian-mixture EM, including the ELBO gap.">
<style>
:root{color-scheme:light;--paper:#f7f5ef;--panel:#fffefb;--ink:#203129;--muted:#66756e;--rule:#d8ded7;--green:#2f6b4f;--soft:#e7f0ea;--rust:#a94f2a;--warm:#f5e8df;--blue:#496e87}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.4 Inter,ui-sans-serif,system-ui,sans-serif}button,input,select{font:inherit}button,select{border:1px solid var(--rule);border-radius:7px;background:var(--panel);color:var(--ink);padding:7px 10px}button{cursor:pointer;font-weight:650}button:hover{border-color:var(--green)}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}button:disabled{opacity:.5;cursor:default}.primary{background:var(--green);color:white;border-color:var(--green)}a{color:var(--green)}nav{max-width:1200px;margin:20px auto;display:flex;justify-content:space-between;gap:12px;padding:0 16px}nav span{font-family:Georgia,serif;font-size:22px}nav a{margin-left:12px;font-size:13px}main{max-width:1200px;margin:0 auto;padding:12px}.embedded nav{display:none}.embedded main{padding:0}.lab{display:grid;grid-template-columns:276px minmax(0,1fr);gap:12px;height:475px}.controls,.chart,.metrics{border:1px solid var(--rule);border-radius:12px;background:var(--panel)}.controls{padding:14px;overflow:auto}.eyebrow{color:var(--rust);font:800 10px/1.4 ui-monospace,monospace;letter-spacing:1px;text-transform:uppercase}h1{font:700 24px/1.12 Georgia,serif;margin:8px 0 10px}h2{font:750 11px/1.3 ui-monospace,monospace;color:var(--muted);margin:0 0 5px;letter-spacing:.5px;text-transform:uppercase}p{margin:8px 0;font-size:12px;color:var(--muted)}label.field{display:block;margin:12px 0 5px;font-size:12px;font-weight:650}label.field output{float:right;font-family:ui-monospace,monospace;color:var(--green)}input[type=range]{width:100%;accent-color:var(--green);margin:5px 0}select{width:100%;font-size:12px}input[type=checkbox]{accent-color:var(--green)}.check{font-size:12px;display:flex;align-items:center;gap:6px;margin:10px 0}.buttons{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.buttons button{font-size:12px;flex:1;white-space:nowrap}.stack{display:grid;gap:10px;min-width:0}.meanfield .stack{grid-template-rows:299px 65px 1fr}.em .stack{grid-template-rows:258px 144px 1fr}.chart{padding:9px 11px;min-width:0;overflow:hidden}.chart svg{display:block;width:100%;height:calc(100% - 19px)}.meanfield .plots{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:10px;min-width:0}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:9px 13px}.metric span{display:block;font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.4px}.metric strong{display:block;font:650 22px/1.25 ui-monospace,monospace;white-space:nowrap}.message{border-radius:9px;background:var(--soft);padding:10px 13px;font-size:12px;line-height:1.45}.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:10px;color:var(--muted)}.swatch{display:inline-block;width:17px;height:3px;vertical-align:middle;margin-right:4px}.target{background:var(--green)}.approx{background:var(--rust)}.marginal{background:var(--blue)}.param{font:11px/1.8 ui-monospace,monospace;background:var(--paper);padding:7px 9px;border-radius:7px}.hint{font-size:10px;margin-top:7px}.phase{font:800 10px ui-monospace,monospace;color:var(--rust)}.mobile-nav{display:none}.embedded .mobile-nav{display:flex;justify-content:space-between;margin-top:7px}.mobile-nav button{font-size:10px;padding:3px 7px}.error{padding:20px;color:#8b2d20}.status{min-height:35px}
@media(min-width:900px){body:not(.embedded) main{padding:18px}body:not(.embedded) .lab{height:510px}body:not(.embedded) .meanfield .stack{grid-template-rows:334px 65px 1fr}body:not(.embedded) .em .stack{grid-template-rows:285px 151px 1fr}}
@media(max-width:700px){.lab{display:block;height:auto}.controls{margin-bottom:12px;overflow:visible}.stack{min-height:475px}.meanfield .plots{grid-template-columns:1fr 1fr}.meanfield .stack{grid-template-rows:260px 70px auto}.em .stack{grid-template-rows:260px 145px auto}.metric strong{font-size:18px}nav{display:block}.embedded .controls{max-height:none}h1{font-size:25px}.buttons button{min-height:38px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
