<svg xmlns="http://www.w3.org/2000/svg" width="562" height="448" viewBox="0 0 562 448" role="img" aria-labelledby="title description"><title id="title">A scalar L1 update moves a Gaussian center toward a bright target pixel</title><desc id="description">The two curves are C(p; mu)=0.8 exp(-(p-mu)^2/2). At pixel p=1, the fixed target intensity is 0.8. The initial center is zero and prediction 0.485225. The L1 center derivative is -0.485225. One step of size 0.1 moves the center to 0.048522, increasing the prediction to 0.508750 and decreasing absolute error from 0.314775 to 0.291250. The plotted displacement is not exaggerated.</desc><rect width="562" height="448" fill="#F5F3ED"/><text x="22" y="29" fill="#182D33" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">One pixel pulls the center right</text><line x1="25" y1="57" x2="51" y2="57" stroke="#B44F37" stroke-width="2.7" stroke-dasharray="6 4"/><text x="58" y="62" fill="#B44F37" font-family="Arial, Helvetica, sans-serif" font-size="13" >Before</text><line x1="128" y1="57" x2="154" y2="57" stroke="#16736E" stroke-width="2.7"/><text x="161" y="62" fill="#16736E" font-family="Arial, Helvetica, sans-serif" font-size="13" >After one step</text><circle cx="288" cy="57" r="4" fill="#182D33"/><text x="299" y="62" fill="#182D33" font-family="Arial, Helvetica, sans-serif" font-size="13" >Target pixel</text><rect x="54" y="89" width="326" height="207" fill="#FFFDFA"/><line x1="54" y1="296" x2="380" y2="296" stroke="#D6DEDC"/><text x="45" y="301" fill="#60747A" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end">0.0</text><line x1="54" y1="204" x2="380" y2="204" stroke="#D6DEDC"/><text x="45" y="209" fill="#60747A" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end">0.4</text><line x1="54" y1="112" x2="380" y2="112" stroke="#D6DEDC"/><text x="45" y="117" fill="#60747A" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end">0.8</text