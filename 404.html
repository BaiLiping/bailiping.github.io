<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Page not found | Bai Liping</title>
    <link rel="icon" href="/favicon.ico">
    <style>
      /* Self-contained on purpose: GitHub Pages serves this file for any missing path. */
      @font-face {
        font-family: 'Source Serif 4';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url(/assets/fonts/source-serif-4-400-700-latin.woff2) format('woff2');
      }
      :root {
        color-scheme: light;
        --ink: #1a2332;
        --body: #374151;
        --muted: #636b78;
        --accent: #2f6b4f;
        --accent-hover: #1e5039;
        --line: #e2e4e7;
      }
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        background: #fff;
        color: var(--body);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 16px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      body::before { content: ''; display: block; height: 3px; background: var(--accent); }
      a { color: var(--accent); text-decoration: none; }
      a:hover { color: var(--accent-hover); text-decoration: underline; text-underline-offset: 0.18em; }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
      main { width: min(560px, calc(100% - 40px)); margin: 0 auto; padding: 88px 0 96px; }
      .brand { font-family: 'Source Serif 4', Georgia, 'Times New Roman', serif; font-size: 22px; font-weight: 650; color: var(--ink); }
      .brand:hover { color: var(--ink); text-decoration: none; }
      .code { margin: 56px 0 6px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
      h1 { margin: 0 0 14px; font-family: 'Source Serif 4', Georgia, 'Times New Roman', serif; font-size: 36px; line-height: 1.2; font-weight: 650; letter-spacing: -0.01em; color: var(--ink); }
      p { margin: 0; }
      nav { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 30px; padding-top: 22px; border-top: 1px solid var(--line); }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/">Bai Liping</a>
      <p class="code">Error 404</p>
      <h1>Page not found</h1>
      <p>This address does not match a page on this site. It may have moved or been renamed.</p>
      <nav aria-label="Where to go next">
        <a href="/">Homepage</a>
        <a href="/site-map/">All pages</a>
      </nav>
    </main>
  </body>
</html>
